root __APP_DIR__/current/public;

client_max_body_size 10m;
server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 60s;

location = / {
    if ($emostr_terminal) {
        rewrite ^ /curl last;
    }
    include snippets/emostr-headers.conf;
    add_header Vary "User-Agent";
    proxy_pass http://emostr_web;
}

include snippets/emostr-terminal.conf;

location /_next/static/ {
    alias __APP_DIR__/current/.next/static/;
    include snippets/emostr-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location / {
    proxy_pass http://emostr_web;
}
