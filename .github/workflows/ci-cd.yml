name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Проверка типов (TypeScript 7)
        run: npm run typecheck

      - name: Сборка
        run: npm run build

      - name: Упаковка релиза
        if: github.event_name != 'pull_request'
        run: bash deploy/pack.sh dist/release.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: |
            dist/release.tar.gz
            deploy/release.sh
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Деплой на сервер
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, emostr-web]
    environment:
      name: production
      url: https://emostr.com
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP_DIR: ${{ vars.DEPLOY_PATH || '/var/www/emostr' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Выкладка релиза
        run: |
          name="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          install -m 644 release/dist/release.tar.gz "$APP_DIR/incoming/$name.tar.gz"
          bash release/deploy/release.sh "$name"

      - name: Очистка рабочей папки
        if: always()
        run: rm -rf release
